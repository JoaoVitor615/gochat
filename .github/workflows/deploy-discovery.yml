name: Deploy Discovery

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-discovery
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 through SSM
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deploy command through SSM
        id: send-command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_DIR: ${{ vars.EC2_APP_DIR }}
        run: |
          set -euo pipefail

          parameters=$(jq -n --arg dir "$APP_DIR" '{commands: [
            "set -eu",
            "cd -- " + ($dir | @sh),
            "git fetch origin master",
            "git checkout master",
            "git pull --ff-only origin master",
            "docker compose up -d --build"
          ]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy GoChat Discovery from GitHub Actions" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          echo "command-id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send-command.outputs.command-id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM command $COMMAND_ID"
          exit 1
