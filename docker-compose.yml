services:
  redis:
    image: redis:latest
    container_name: gochat-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  discovery:
    build:
      context: .
      dockerfile: cmd/discovery/Dockerfile
    env_file:
      - .env.discovery
    ports:
      - "8080:8080"
      - "4001:4001/udp"
    volumes:
      - observer_data:/var/lib/gochat-observer
    depends_on:
      - redis
volumes:
  observer_data:
